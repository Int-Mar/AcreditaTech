<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcreditaTech - Cuestionario Opción Múltiple</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inria+Serif:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="dashboard-body">

    <div class="dashboard-container">
        
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="menuUsuario.html" class="nav-item" title="Inicio">
                    <img src="../img/Inicio.png" alt="Inicio" class="nav-icon">
                </a>
                <a href="progresoUsuario.html" class="nav-item" title="Progreso / Test">
                    <img src="../img/Progreso.png" alt="Progreso" class="nav-icon">
                </a>
                <a href="ConsultarApp.html" class="nav-item" title="Resultados y Guías">
                    <img src="../img/Guias.png" alt="Consulta App de Guias" class="nav-icon">
                </a>
            </nav>
            <div class="sidebar-bottom">
                <a href="perfilUsuario.html" class="nav-item" title="Perfil">
                    <img src="../img/Perfil.png" alt="Consulta Perfil" class="nav-icon">
                </a>
                <a href="../login.html" class="nav-item" title="Cerrar Sesión">
                    <img src="../img/Salir.png" alt="Cerrar Sesión" class="nav-icon">
                </a>
            </div>
        </aside>

        <div class="main-area">
            <header class="top-bar">
                <div class="logo-container">
                    <img src="../img/LogoBlanco.png" alt="AcreditaTech Logo" class="logo-img">
                    <span class="logo-text">AcreditaTech</span>
                </div>
            </header>

            <main class="quiz-content-area">
                <div class="quiz-card-socrative">
                    
                    <!-- ID para cambiar el número de pregunta con JS -->
                    <div class="quiz-counter" id="quizCounter">Pregunta 1 de 10</div>

                    <!-- ID para cambiar el texto de la pregunta con JS -->
                    <div class="quiz-question-title" id="quizQuestion">
                        ¿Aquí irá el texto de la pregunta o dilema?
                    </div>

                    
                    <!-- Opciones convertidas a botones interactivos reales -->
                    <div class="quiz-options-container">
                        <button type="button" class="quiz-option-btn" id="opt1">Opción 1</button>
                        <button type="button" class="quiz-option-btn" id="opt2">Opción 2</button>
                        <button type="button" class="quiz-option-btn" id="opt3">Opción 3</button>
                        <button type="button" class="quiz-option-btn" id="opt4">Opción 4</button>
                    </div>

                    <div class="quiz-submit-container">
                        <a href="QuizT_F.html" class="btn-subir-respuesta" id="btnSubmit">Subir respuesta</a>
                    </div>

                </div>
            </main>
        </div>
    </div>

</body>
</html>
