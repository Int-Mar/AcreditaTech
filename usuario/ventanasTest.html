<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcreditaTech - Inicio de Test</title>
    
    <!-- Fuentes Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inria+Serif:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Ruta al archivo CSS principal -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="dashboard-body">

    <div class="dashboard-container">
        
        <!-- Barra Lateral Exclusiva de Usuario -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="menuUsuario.html" class="nav-item" title="Inicio">
                    <img src="../img/Inicio.png" alt="Inicio" class="nav-icon">
                </a>

                <a href="progresoUsuario.html" class="nav-item" title="Progreso / Test">
                    <img src="../img/Progreso.png" alt="Progreso" class="nav-icon">
                </a>

                <a href="ConsultarApp.html" class="nav-item" title="Resultados y Guías">
                    <img src="../img/Guias.png" alt="Consulta App de Guias" class="nav-icon">
                </a>
            </nav>
            <div class="sidebar-bottom">
                <a href="perfilUsuario.html" class="nav-item" title="Perfil">
                    <img src="../img/Perfil.png" alt="Consulta Perfil" class="nav-icon">
                </a>
                <a href="../login.html" class="nav-item" title="Cerrar Sesión">
                    <img src="../img/Salir.png" alt="Cerrar Sesión" class="nav-icon">
                </a>
            </div>
        </aside>

        <!-- Área Principal -->
        <div class="main-area">
            <!-- Barra Superior -->
            <header class="top-bar">
                <div class="logo-container">
                    <img src="../img/LogoBlanco.png" alt="AcreditaTech Logo" class="logo-img">
                    <span class="logo-text">AcreditaTech</span>
                </div>
            </header>

            <!-- Contenido de la Pantalla de Inicio del Test -->
            <main class="test-intro-content-area">
                <div class="test-intro-card">
                    
                    <!-- Título dinámico del test (Ej. Test Diagnóstico de Salud Ocupacional / Test Técnico) -->
                    <h2 class="test-intro-title" id="testTitle">Test Diagnóstico de Salud Ocupacional</h2>
                    
                    <!-- Descripción detallada del test -->
                    <p class="test-intro-desc" id="testDescription">
                        Este cuestionario fue diseñado para medir tus competencias socioemocionales.
                    </p>

                    <!-- Botón de acción para iniciar -->
                    <div class="test-intro-action">
                        <a href="QuizOpMultiple.html" class="btn-iniciar-test" id="btnStartTest">Iniciar Test</a>
                    </div>

                    <!-- Etiqueta inferior del tipo de evaluación -->
                    <span class="test-intro-footer-label" id="testFooterLabel">Evaluación</span>

                </div>
            </main>
        </div>
    </div>

</body>
</html>
